<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar atendimento</title><link rel="stylesheet" href="settings.css"></head><body>
<header><span class="mark">♪</span><div><h1>Telegram Atendimento</h1><small>Extensão 3.1</small></div></header><div id="notice" class="notice">Carregando…</div>
<section id="connection"><h2>Conectar ao servidor</h2><p>Use os mesmos dados do dashboard.</p><form id="connectionForm"><label>Backend no Render<input id="apiUrl" type="url" required placeholder="https://telegram-atendimento.onrender.com"></label><label>Chave de acesso<input id="accessToken" type="password" required minlength="32" autocomplete="off" placeholder="ACCESS_TOKEN"></label><button id="saveConnection" type="submit">Salvar conexão</button></form></section>
<section id="auth" hidden><h2>Conectar conta do Telegram</h2><p id="authMessage">Use a mesma conta aberta no Telegram Web.</p><label id="phoneRow">Telefone com DDI<input id="phone" placeholder="+5511999999999" autocomplete="tel"><button id="login">Receber código</button></label><label id="codeRow" hidden>Código recebido<input id="code" autocomplete="one-time-code"><button id="confirmCode">Confirmar código</button></label><label id="passwordRow" hidden>Senha de duas etapas<input id="password" type="password" autocomplete="off"><button id="confirmPassword">Conectar</button></label></section>
<section id="ready" hidden><div class="success">✓</div><h2>Extensão pronta</h2><p id="account"></p><p>Abra uma conversa no Telegram Web. Seus áudios aparecerão acima do campo de mensagem.</p><button id="changeConnection" class="secondary">Alterar conexão</button></section>
<script type="module" src="settings.js"></script></body></html>
