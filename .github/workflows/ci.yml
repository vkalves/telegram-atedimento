name: Mega regressao

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar ferramentas de mídia
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Instalar dependencias
        working-directory: server
        run: npm ci
      - name: Auditar dependencias de producao
        working-directory: server
        run: npm audit --omit=dev
      - name: Verificar sintaxe
        run: |
          node --check server/src/server.js
          node --check dashboard/app.js
          node --check dashboard/flows.js
          node --check extension/background.js
          node --check extension/content.js
      - name: Testar backend, banco, dashboard e extensao
        run: |
          FFMPEG_PATH="$PWD/server/node_modules/ffmpeg-static/ffmpeg" npm --prefix server test
          node --test extension/target.test.mjs

  image:
    name: Imagem de producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir Docker do backend
        run: docker build --tag telegram-atendimento:test server
